name: Intelligence Capabilities Contract
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  validate-intelligence-capabilities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Runtime
        run: python --version
      - name: Positive and negative contract tests
        run: python .github/scripts/intelligence_capability_contract.py --self-test
      - name: Validate universalis profile
        run: python .github/scripts/intelligence_capability_contract.py --check --profile universalis
      - name: Repository quality baseline
        run: python .github/scripts/repository_quality_baseline.py --self-test --check
